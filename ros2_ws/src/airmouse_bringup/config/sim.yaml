# Simulation overrides (applied after airmouse.yaml). Arena values come from the maze generator.
/**:
  ros__parameters:
    floor_z: -0.19

pose_bridge:
  ros__parameters:
    # must match LIDAR_POSE in airmouse_sim/drone_model.py
    lidar_mount_xyz: [0.0, 0.0, -0.06]
    lidar_mount_rpy: [3.14159265, 0.0, 0.0]

commander:
  ros__parameters:
    # The SITL iris is wider than the real AirMouse airframe: 0.35 m half-width across the
    # arms, 0.38 m prop-tip radius. sim.launch.py scales the maze by maze_scale (default 1.3)
    # to compensate; these values suit 1.3 m corridors. Plan at full map resolution.
    inflation_radius: 0.42
    plan_resolution: 0.05
    turn_clearance: 0.48

survivor_detector:
  ros__parameters:
    # must match CAMERA_POSE in airmouse_sim/drone_model.py
    camera_mount_xyz: [0.15, 0.0, 0.02]
    camera_pitch: 0.26
    camera_hfov: 1.57
